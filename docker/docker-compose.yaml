services:
  noetic:
    container_name: noetic_container
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mppi_swerve_drive_ros:noetic
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /root/mppi_swerve_drive_ros
    volumes:
      - ../:/root/mppi_swerve_drive_ros
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    command: ["bash", "-lc", "sleep infinity"]
